# Masroof detekt — focused on dead-code hygiene (unused members and imports).
# Full default rule sets are disabled; expand gradually as needed.

style:
  active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    ignoreAnnotated:
      - 'Preview'
  UnusedPrivateProperty:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'

ktlint:
  active: true
  UnusedImports:
    active: true
    autoCorrect: false

# Size limits block new oversized code; existing offenders are listed in each module's detekt-baseline.xml.
complexity:
  active: true
  LongMethod:
    active: true
    allowedLines: 80
  LargeClass:
    active: true
    allowedLines: 600
