name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api-level: ${{ steps.android.outputs.api-level }}
      image-version: ${{ steps.android.outputs.image-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Verify CI routing, protocol and publication contracts
        run: |
          python3 scripts/test-latest-stable-android.py
          python3 scripts/test-lifecycle-suite.py
          python3 scripts/test_ci_device.py
          bash scripts/test-verify-ci-status.sh
          bash scripts/test-version-resolution.sh
          bash scripts/test-handle-pr-comment.sh
      - name: Resolve validated Android image
        id: android
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('ci/device-suites.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f"api-level={config['api']}", file=out)
              print(f"image-version={config['imageVersion']}", file=out)
          print(f"Validated Google APIs x86_64 image: API {config['api']}, package {config['imageVersion']}")
          PY

  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install Java 21 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
      - run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - run: sudo install -d -m 0777 /opt/cursor/artifacts
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :bank-engine:test :finance-core:test :ml-assist:test --stacktrace
      - name: Preserve complete unit-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-test-reports
          path: |
            ui-kit/build/reports/tests/
            app/build/reports/tests/
            bank-engine/build/reports/tests/
            finance-core/build/reports/tests/
            ml-assist/build/reports/tests/
          if-no-files-found: error
      - name: Verify trained model reproducibility
        run: |
          python3 ml-assist/tools/test_train_family_model.py
          python3 ml-assist/tools/train_family_model.py --check --skip-export
          python3 ml-assist/tools/test_training.py
          ./gradlew :ml-assist:trainRecurringSeed -PrecurringCheck=true --console=plain

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java 21 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
      - run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Lint and detekt
        run: ./gradlew lintDebug detekt --stacktrace

  build-test-apks:
    needs: android-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install Java 21 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
      - run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Build shared test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Bundle exact APKs, provenance and balanced test plan
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_device.py bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-test-apks
          path: app/build/ci-device/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  emulator-app:
    needs: [android-version, build-test-apks]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install Java 21 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-test-apks
          path: app/build/ci-device/
      - name: Use current tools for emulator creation
        run: |
          selected_android_tools="$(dirname "$(dirname "$(command -v avdmanager)")")"
          grep -Fx 'Pkg.Revision=23.0' "${selected_android_tools}/source.properties"
          android_tools_latest="${ANDROID_HOME}/cmdline-tools/latest"
          if [ "$(realpath "${android_tools_latest}")" != "$(realpath "${selected_android_tools}")" ]; then
            rm -rf "${android_tools_latest}"
            ln -s "${selected_android_tools}" "${android_tools_latest}"
          fi
      - name: Resolve SDK cache path
        id: sdk
        run: echo "root=${ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"
      - name: Cache Android system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sdk.outputs.root }}/system-images/android-${{ needs.android-version.outputs.image-version }}/google_apis/x86_64
          key: android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.android-version.outputs.image-version }}-google_apis-x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ needs.android-version.outputs.image-version }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          pre-emulator-launch-script: grep -Fx 'target=android-${{ needs.android-version.outputs.image-version }}' "$ANDROID_AVD_HOME/test.ini"
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -partition-size 8192
          script: python3 scripts/ci_device.py run --shard ${{ matrix.shard }}
      - name: Preserve per-case evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports-${{ matrix.shard }}
          path: app/build/reports/device-ci/
          if-no-files-found: error

  emulator-recovery:
    needs: [android-version, build-test-apks]
    strategy:
      fail-fast: false
      matrix:
        suite: [production]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install Java 21 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-test-apks
          path: app/build/ci-device/
      - name: Restore checked APK paths without compiling
        run: python3 scripts/ci_device.py restore
      - name: Use current tools for emulator creation
        run: |
          selected_android_tools="$(dirname "$(dirname "$(command -v avdmanager)")")"
          grep -Fx 'Pkg.Revision=23.0' "${selected_android_tools}/source.properties"
          android_tools_latest="${ANDROID_HOME}/cmdline-tools/latest"
          if [ "$(realpath "${android_tools_latest}")" != "$(realpath "${selected_android_tools}")" ]; then
            rm -rf "${android_tools_latest}"
            ln -s "${selected_android_tools}" "${android_tools_latest}"
          fi
      - name: Resolve SDK cache path
        id: sdk
        run: echo "root=${ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"
      - name: Cache Android system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.sdk.outputs.root }}/system-images/android-${{ needs.android-version.outputs.image-version }}/google_apis/x86_64
          key: android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.android-version.outputs.image-version }}-google_apis-x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Process-death instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CI_DEVICE_BUNDLE: app/build/ci-device
        with:
          api-level: ${{ needs.android-version.outputs.image-version }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          pre-emulator-launch-script: grep -Fx 'target=android-${{ needs.android-version.outputs.image-version }}' "$ANDROID_AVD_HOME/test.ini"
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -partition-size 8192
          script: bash .github/scripts/run-lifecycle-suite.sh ${{ matrix.suite }} test
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-reports-${{ matrix.suite }}
          path: app/build/reports/device-ci/
          if-no-files-found: error

  emulator-lifecycle:
    needs: emulator-recovery
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every recovery suite
        env:
          RECOVERY_RESULT: ${{ needs.emulator-recovery.result }}
        run: test "$RECOVERY_RESULT" = success

  emulator-smoke:
    needs: [android-version, build-test-apks, unit-test, static-analysis, emulator-app, emulator-lifecycle]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete CI
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed: raise SystemExit(f'Incomplete CI: {failed}')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: instrumentation-reports-*
          path: device-results
      - name: Require statement reconciliation screenshots
        run: find device-results -name 'm19-*.png' | grep -q .
