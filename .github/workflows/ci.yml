name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure local SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure local SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Lint and detekt
        run: ./gradlew lintDebug detekt --stacktrace

  # Device smoke for the hardening journeys. JVM unit tests stay the fast PR gate.
  # This job is isolated so an emulator failure does not rewrite production behavior.
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "sdk.dir=${SDK_DIR}" > local.properties
            # notPackage in app/build.gradle.kts keeps M13 process-death phases out of
            # this clearPackageData=true suite.
            ./gradlew connectedDebugAndroidTest --stacktrace
            mkdir -p m19-statement-screenshots
            adb pull /sdcard/m19-statement-screenshots/. m19-statement-screenshots || true
            find m19-statement-screenshots -name 'm19-*.png' | grep -q .

      - name: Upload statement reconciliation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m19-statement-screenshots
          path: m19-statement-screenshots
          if-no-files-found: warn

  # API 30 process death. Separate from emulator-smoke so clearPackageData=true
  # cannot wipe the database between the halt and the restarted process.
  emulator-lifecycle-api30:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 30 process-death instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "sdk.dir=${SDK_DIR}" > local.properties
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            for attempt in 1 2 3; do
              bash scripts/m13-process-death.sh
            done

  # API 34 process death. The script force-stops the app from the runner, then
  # starts a new instrumentation process. It does not use clearPackageData.
  emulator-lifecycle-api34:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 34 process-death instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "sdk.dir=${SDK_DIR}" > local.properties
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            for attempt in 1 2 3; do
              bash scripts/m13-process-death.sh
            done

  # API 30's SQLite already has VACUUM INTO. This job runs the pre-3.27 fallback
  # on API 28, where the platform SQLite is older than 3.27.
  pre-vacuum-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API 28 pre-VACUUM INTO backup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "sdk.dir=${SDK_DIR}" > local.properties
            ./gradlew connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.baraa.masroof.instrumentation.PreVacuumBackupSnapshotTest
