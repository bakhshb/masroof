name: One-time old branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-old-branches.yml

permissions:
  contents: write

jobs:
  delete-old-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -u
          failed=0

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == "HEAD" || "$branch" == "main" ]] && continue

            echo "Deleting $branch"
            if ! git push origin --delete "$branch"; then
              echo "::error::Failed to delete $branch"
              failed=1
            fi
          done < <(
            git for-each-ref               --format='%(refname:strip=3)'               refs/remotes/origin               | sort
          )

          exit "$failed"
