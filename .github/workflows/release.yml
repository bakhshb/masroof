name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Release type (release or nightly)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - nightly
      bump:
        description: 'Version bump segment (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      ref:
        description: 'Target commit SHA or branch'
        required: false
        default: 'main'
        type: string
      pr_number:
        description: 'Associated PR number for feedback (optional)'
        required: false
        default: ''
        type: string
      comment_id:
        description: 'Associated comment ID for reaction (optional)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      type:
        description: 'Release type (release or nightly)'
        required: true
        type: string
        default: 'release'
      bump:
        description: 'Version bump segment (patch, minor, major)'
        required: false
        type: string
        default: 'patch'
      ref:
        description: 'Target commit SHA or branch'
        required: false
        type: string
        default: 'main'
      pr_number:
        description: 'Associated PR number for feedback (optional)'
        required: false
        type: string
        default: ''
      comment_id:
        description: 'Associated comment ID for reaction (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: masroof-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'

      - name: Checkout publication controls from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-control

      - name: Verify CI passed on target commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .release-control/scripts/verify_ci_status.py "$(git rev-parse HEAD)"

      - name: Resolve target version and versionCode
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/resolve-next-version.sh --type "${{ inputs.type || 'release' }}" --bump "${{ inputs.bump || 'patch' }}"

      - name: Install Java 21 toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up current JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833' # 23.0

      - name: Configure local SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Create keystore.properties
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName="${{ steps.version.outputs.version_name }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Verify APK and prepare artifacts
        id: artifacts
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi

          RELEASE_APK="${{ steps.version.outputs.apk_file_name }}"
          cp "$APK_PATH" "$RELEASE_APK"
          SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')

          cat > version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkFileName": "${RELEASE_APK}",
            "sha256": "${SHA256}"
          }
          EOF
          echo "Generated version.json:"
          cat version.json

      - name: Publish GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ inputs.ref || 'main' }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            masroof-*.apk
            version.json
          generate_release_notes: true

      - name: Report success to PR
        if: success() && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_FILE: ${{ steps.version.outputs.apk_file_name }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          TYPE: ${{ inputs.type }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -n "$COMMENT_ID" ]]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content="rocket" || true
          fi
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          cat <<EOF > /tmp/pr_success.md
          🚀 **Masroof ${TAG} published!**
          - **Type:** \`${TYPE}\` (prerelease: \`${IS_PRERELEASE}\`)
          - **Version:** \`${VERSION_NAME}\`
          - **Version Code:** \`${VERSION_CODE}\`
          - **APK:** \`${APK_FILE}\`
          - **Release Notes:** [${TAG}](${RELEASE_URL})
          EOF
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr_success.md || true

      - name: Report failure to PR
        if: failure() && inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO: ${{ github.repository }}
        run: |
          if [[ -n "$COMMENT_ID" ]]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content="-1" || true
          fi
          gh pr comment "$PR_NUMBER" --body "❌ **Release build failed.** Check [workflow run logs](${RUN_URL}) for details." || true

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Publishing summary"
            echo ""
            echo "- **Status:** ${{ job.status }}"
            echo "- **Type:** ${{ inputs.type }}"
            echo "- **Bump:** ${{ inputs.bump }}"
            echo "- **Ref:** ${{ inputs.ref }}"
            echo "- **Tag:** ${{ steps.version.outputs.tag }}"
            echo "- **Version Name:** ${{ steps.version.outputs.version_name }}"
            echo "- **Version Code:** ${{ steps.version.outputs.version_code }}"
            echo "- **Prerelease:** ${{ steps.version.outputs.is_prerelease }}"
          } >> "$GITHUB_STEP_SUMMARY"
